name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Тесты
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Краткий отчёт о провале попадает в аннотацию — видно прямо в интерфейсе GitHub
            summary=$(grep -E "^(FAILED|ERROR)" pytest.log | head -20 | tr '\n' ';')
            [ -z "$summary" ] && summary=$(tail -c 1200 pytest.log | tr '\n' ' ')
            echo "::error title=Тесты не пройдены::${summary:0:3500}"
          fi
          exit "$code"

      - name: Проверка запуска сервера
        run: |
          export AVANS_DATA_DIR="$RUNNER_TEMP/data"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8771 &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8771/api/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8771/api/health
          curl -sf http://127.0.0.1:8771/ | grep -q "Авансовые отчёты"
          kill $SERVER_PID

  frontend:
    name: Проверка интерфейса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Синтаксис JavaScript
        run: node --check app/static/app.js
      - name: Обязательные файлы интерфейса
        run: |
          test -f app/static/index.html
          test -f app/static/styles.css
          test -f app/static/app.js
          test -f app/assets/template.xlsm
