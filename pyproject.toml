[project]
name = "avans-report"
version = "1.0.4"
description = "Авансовые отчёты: заполнение, PDF, печать и отправка по почте (серверная и автономная версии)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.1,<5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
]
